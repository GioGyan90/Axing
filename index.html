<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Hero - H5重心微调版</title>
    <link rel="stylesheet" href="./styles/home.css">
    <style>
        /* 用户登录注册 UI 样式 */
        .auth-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            pointer-events: auto;
        }

        .auth-btn {
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            pointer-events: auto;
        }

        .auth-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 16px 38px rgba(0, 242, 254, 0.35);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(10px);
            pointer-events: auto;
            z-index: 10001;
        }

        .user-name {
            color: white;
            font-weight: bold;
        }

        .logout-btn {
            padding: 5px 12px;
            border-radius: 20px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* 模态框样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            pointer-events: none;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .modal-content {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(30px);
            border-radius: 32px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(79, 172, 254, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            transform: scale(0.9);
            transition: transform 0.3s ease;
            pointer-events: auto;
            z-index: 20001;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 2rem;
            margin: 0 0 30px 0;
            text-align: center;
            background: linear-gradient(90deg, #fff, var(--primary-color), var(--secondary-color), #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .submit-btn {
            flex: 1;
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 16px 38px rgba(0, 242, 254, 0.35);
        }

        .cancel-btn {
            flex: 1;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.2s ease;
        }

        .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .switch-mode {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.7);
        }

        .switch-mode a {
            color: var(--primary-color);
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }

        .switch-mode a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }

        .message.success {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .message.error {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
        }

        .github-sync-btn {
            margin-top: 15px;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(79, 172, 254, 0.5);
            background: rgba(79, 172, 254, 0.1);
            color: var(--primary-color);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .github-sync-btn:hover {
            background: rgba(79, 172, 254, 0.2);
            border-color: var(--primary-color);
        }

        @media (max-width: 768px) {
            .auth-container {
                top: 10px;
                right: 10px;
            }

            .auth-btn,
            .user-info {
                padding: 8px 15px;
                font-size: 0.85rem;
            }

            .modal-content {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- 用户认证区域 -->
    <div id="auth-container" class="auth-container"></div>

    <!-- 登录/注册模态框 -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title" class="modal-title">用户登录</h2>
            <div id="message-area"></div>
            <form id="auth-form">
                <div class="form-group">
                    <label for="username-input">用户名</label>
                    <input type="text" id="username-input" required minlength="3" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="password-input">密码</label>
                    <input type="password" id="password-input" required minlength="6" placeholder="请输入密码">
                </div>
                <div class="form-actions">
                    <button type="button" id="cancel-btn" class="cancel-btn">取消</button>
                    <button type="submit" id="submit-btn" class="submit-btn">登录</button>
                </div>
            </form>
            <div class="switch-mode">
                <span id="switch-text">还没有账号？</span>
                <a id="switch-link" href="#">立即注册</a>
            </div>
            <button id="github-sync-btn" class="github-sync-btn" style="display: none;">📦 同步到 GitHub</button>
        </div>
    </div>

    <div id="barrage-container"></div>
    <div id="canvas-container"></div>

    <section class="hero">
        <div class="hero-content">
            <h1>我叫ZL9</h1>
            <p>用最不堪的语言攻击我最薄弱的地方！</p>
            <div class="barrage-control">
                <input type="text" id="barrage-input" placeholder="输入攻击弹幕..." maxlength="15">
                <button id="send-btn">发送</button>
            </div>
            <div class="home-links">
                <a class="home-link game-link" href="./isometric-football.html" aria-label="进入 Three.js 等距足球小游戏">
                    ⚽ 进入等距足球小游戏
                </a>
                <a class="home-link gallery-link" href="./exhibition.html" aria-label="进入 ZL9 模型展览馆">
                    🏛️ 进入模型展览馆
                </a>
            </div>
        </div>
    </section>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="./scripts/home/auth.js"></script>
    <script type="module" src="./scripts/home/main.js"></script>
    <script type="module">
        // 用户认证 UI 逻辑
        import { AuthManager } from './scripts/home/auth.js';

        const authContainer = document.getElementById('auth-container');
        const authModal = document.getElementById('auth-modal');
        const modalTitle = document.getElementById('modal-title');
        const messageArea = document.getElementById('message-area');
        const authForm = document.getElementById('auth-form');
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const submitBtn = document.getElementById('submit-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const switchLink = document.getElementById('switch-link');
        const switchText = document.getElementById('switch-text');
        const githubSyncBtn = document.getElementById('github-sync-btn');

        let isLoginMode = true;

        // 初始化用户状态
        function initAuthUI() {
            if (window.authManager && window.authManager.isLoggedIn()) {
                showUserInfo();
            } else {
                showLoginButton();
            }
        }

        // 显示登录按钮
        function showLoginButton() {
            authContainer.innerHTML = '<button class="auth-btn" id="login-btn">👤 登录/注册</button>';
            document.getElementById('login-btn').addEventListener('click', () => {
                openModal(true);
            });
        }

        // 显示用户信息
        function showUserInfo() {
            const username = window.authManager.getUsername();
            authContainer.innerHTML = `
                <div class="user-info">
                    <span class="user-name">👤 ${username}</span>
                    <button class="logout-btn" id="logout-btn">退出</button>
                </div>
            `;
            document.getElementById('logout-btn').addEventListener('click', () => {
                window.authManager.logout();
                initAuthUI();
            });
        }

        // 打开模态框
        function openModal(loginMode = true) {
            isLoginMode = loginMode;
            updateModalContent();
            authModal.classList.add('active');
            usernameInput.focus();
        }

        // 关闭模态框
        function closeModal() {
            authModal.classList.remove('active');
            messageArea.innerHTML = '';
            authForm.reset();
        }

        // 更新模态框内容
        function updateModalContent() {
            if (isLoginMode) {
                modalTitle.textContent = '用户登录';
                submitBtn.textContent = '登录';
                switchText.textContent = '还没有账号？';
                switchLink.textContent = '立即注册';
            } else {
                modalTitle.textContent = '用户注册';
                submitBtn.textContent = '注册';
                switchText.textContent = '已有账号？';
                switchLink.textContent = '立即登录';
            }
        }

        // 显示消息
        function showMessage(message, type = 'error') {
            messageArea.innerHTML = `<div class="message ${type}">${message}</div>`;
        }

        // 处理表单提交
        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            let result;
            if (isLoginMode) {
                result = window.authManager.login(username, password);
            } else {
                result = window.authManager.register(username, password);
            }

            if (result.success) {
                showMessage(result.message, 'success');
                setTimeout(() => {
                    closeModal();
                    initAuthUI();
                }, 1000);
            } else {
                showMessage(result.message, 'error');
            }
        });

        // 取消按钮
        cancelBtn.addEventListener('click', closeModal);

        // 切换登录/注册模式
        switchLink.addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            updateModalContent();
            messageArea.innerHTML = '';
            passwordInput.value = '';
        });

        // 点击模态框外部关闭
        authModal.addEventListener('click', (e) => {
            if (e.target === authModal) {
                closeModal();
            }
        });

        // GitHub 同步按钮（可选功能）
        githubSyncBtn.addEventListener('click', async () => {
            if (!window.authManager.isLoggedIn()) return;

            const token = prompt('请输入您的 GitHub Personal Access Token:');
            if (!token) return;

            const owner = prompt('请输入 GitHub 用户名 (仓库所有者):');
            if (!owner) return;

            const repo = prompt('请输入仓库名称:');
            if (!repo) return;

            githubSyncBtn.textContent = '⏳ 同步中...';
            
            const result = await window.authManager.syncToGitHub(
                window.authManager.currentUser,
                { token, owner, repo }
            );

            if (result.success) {
                alert('✅ ' + result.message);
            } else {
                alert('❌ ' + result.message);
            }

            githubSyncBtn.textContent = '📦 同步到 GitHub';
        });

        // 页面加载时初始化
        initAuthUI();
    </script>
</body>
</html>
